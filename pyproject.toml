[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-brief"
version = "0.1.0"
description = "A small, evidence-first research agent that produces cited briefings"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
agent-brief = "agent_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

